log:
  level: INFO

entryPoints:
  web:
    # http
    address: ':80'
    http:
      # https://doc.traefik.io/traefik/routing/entrypoints/#entrypoint
      redirections:
        entryPoint:
          to: web-secure

  web-secure:
    # https
    address: ':443'

certificatesResolvers:
  letsencrypt:
    # https://doc.traefik.io/traefik/https/acme/#lets-encrypt
    acme:
      email: 'jangeador@gmail.com'
      storage: /etc/traefik/acme/acme.json
      # dns challenge
      dnsChallenge:
        provider: cloudflare
        delayBeforeCheck: 0
        resolvers:
          - '1.1.1.1:53'
          - '8.8.8.8:53'

http:
  routers:
    web-secure-router:
      rule: 'Host(`jarvis.gesd32.net`)'
      entryPoints:
        - web-secure
      middlewares:
        - apiKeyAuth
      service: ollama
      tls:
        # https://doc.traefik.io/traefik/routing/routers/#certresolver
        certResolver: letsencrypt

  middlewares:
    apiKeyAuth:
      apiKeyAuth:
        headerField: 'X-API-Key'
        apiKeys:
          - '123456'
          - '789012'

  services:
    ollama:
      loadBalancer:
        servers:
          - url: http://ollama:11434

providers:
  # https://doc.traefik.io/traefik/master/providers/file/
  file:
    filename: /etc/traefik/traefik.yml
    watch: true
